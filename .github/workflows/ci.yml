name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The only network access: Python and the locked packages. No secrets, no paid services.
      - name: Install
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff format check
        run: uv run --frozen ruff format --check .

      - name: Pyright
        run: uv run --frozen pyright

      - name: Pytest
        run: uv run --frozen pytest

      # Test fixtures under tests/ are checked by pytest; this covers the shipped benchmarks.
      - name: Validate benchmark specs and dataset manifests
        run: |
          status=0
          files=$(find benchmarks datasets -type f \
            \( -name 'benchmark.yaml' -o -name 'manifest.yaml' \
               -o -path 'datasets/manifests/*.yaml' -o -path 'datasets/manifests/*.jsonl' \) \
            | sort -u)
          if [ -z "$files" ]; then echo "no benchmark specs or manifests found"; exit 1; fi
          for file in $files; do
            uv run --frozen geoevals validate "$file" || status=1
          done
          exit $status

      - name: Smoke run
        run: |
          uv run --frozen geoevals run --benchmark benchmarks/smoke/benchmark.yaml \
            --adapter mock --config benchmarks/smoke/run_config.yaml --out runs/smoke

      - name: Smoke report
        run: |
          run_dir=$(find runs/smoke -mindepth 1 -maxdepth 1 -type d)
          uv run --frozen geoevals validate "$run_dir/result.json"
          uv run --frozen geoevals report "$run_dir"
          cat "$run_dir/report.md"

