name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The only network access: Python and the packages (locked, plus cffconvert), and the
      # gitleaks release in the secrets job. No secrets, no paid services.
      - name: Install
        run: uv sync --frozen

      # cffconvert pins an older jsonschema than geoevals, so it runs in its own uvx environment.
      - name: Validate CITATION.cff
        run: uvx cffconvert==2.0.0 --validate -i CITATION.cff

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff format check
        run: uv run --frozen ruff format --check .

      - name: Pyright
        run: uv run --frozen pyright

      - name: Pytest
        run: uv run --frozen pytest

      # Test fixtures under tests/ are checked by pytest; this covers the shipped benchmarks.
      - name: Validate benchmark specs and dataset manifests
        run: |
          status=0
          files=$(find benchmarks datasets -type f \
            \( -name 'benchmark.yaml' -o -name 'manifest.yaml' \
               -o -path 'datasets/manifests/*.yaml' -o -path 'datasets/manifests/*.jsonl' \) \
            | sort -u)
          if [ -z "$files" ]; then echo "no benchmark specs or manifests found"; exit 1; fi
          for file in $files; do
            uv run --frozen geoevals validate "$file" || status=1
          done
          exit $status

      - name: License inventory is up to date
        run: uv run --frozen geoevals data inventory --check

      # Regenerates docs/dependency-licenses.md for this job's Python and platform; exits 1 on a
      # GPL or AGPL runtime dependency (GeoEvals is MIT licensed).
      - name: Dependency license report
        run: |
          uv run --frozen geoevals data licenses --out docs/dependency-licenses.md
          cat docs/dependency-licenses.md

      - name: Smoke run
        run: |
          uv run --frozen geoevals run --benchmark benchmarks/smoke/benchmark.yaml \
            --adapter mock --config benchmarks/smoke/run_config.yaml --out runs/smoke

      - name: Smoke report
        run: |
          run_dir=$(find runs/smoke -mindepth 1 -maxdepth 1 -type d)
          uv run --frozen geoevals validate "$run_dir/result.json"
          uv run --frozen geoevals report "$run_dir"
          cat "$run_dir/report.md"


  # Reruns every published baseline in a fresh environment built only from uv.lock: no uv cache,
  # no restored .venv. Any difference from a committed result fails the job.
  reproduce:
    name: Reproduce published baselines (clean environment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.11"
      UV_NO_CACHE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: false

      - name: Create a fresh environment
        run: |
          test ! -e .venv
          uv sync --frozen --no-cache

      - name: Reproduce every baseline
        run: |
          status=0
          dirs=$(find baselines -mindepth 2 -maxdepth 2 -type d | sort)
          if [ -z "$dirs" ]; then echo "no baselines found"; exit 1; fi
          for dir in $dirs; do
            echo "== $dir"
            uv run --frozen --no-cache geoevals reproduce "$dir" || status=1
          done
          exit $status

  # Builds the release artifacts and installs the wheel, not the source tree, into a fresh venv.
  # Nothing is uploaded or published: tagging and publishing are left to the maintainer.
  package:
    name: Build and install the wheel (fresh venv)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      # uv build makes the sdist, then the wheel from the sdist, so both must be complete.
      - name: Build the sdist and wheel
        run: |
          uv build
          ls dist/geoevals-*.tar.gz dist/geoevals-*-py3-none-any.whl

      # The runtime dependencies are pinned to uv.lock; the wheel itself is the project.
      - name: Install the wheel into a fresh venv
        run: |
          venv="$RUNNER_TEMP/wheel-venv"
          uv export --frozen --no-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/constraints.txt"
          uv venv "$venv"
          uv pip install --python "$venv/bin/python" --constraint "$RUNNER_TEMP/constraints.txt" \
            dist/geoevals-*-py3-none-any.whl
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: geoevals --version
        run: |
          version=$(geoevals --version)
          expected=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          echo "geoevals $version (pyproject.toml: $expected)"
          test "$version" = "$expected"
          case "$(command -v geoevals)" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac

      - name: Smoke run with the installed wheel
        run: |
          geoevals run --benchmark benchmarks/smoke/benchmark.yaml --adapter mock \
            --config benchmarks/smoke/run_config.yaml --out "$RUNNER_TEMP/runs"
          run_dir=$(find "$RUNNER_TEMP/runs" -mindepth 1 -maxdepth 1 -type d)
          geoevals validate "$run_dir/result.json"
          geoevals report "$run_dir"

  secrets:
    name: Secrets scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks
          rm "$archive"

      # Scans every commit reachable from the checkout; exits 1 on any finding.
      - name: Scan the git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
