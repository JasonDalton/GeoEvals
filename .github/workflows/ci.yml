name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The only network access: Python and the packages (locked, plus cffconvert), and the
      # gitleaks release in the secrets job. No secrets, no paid services.
      - name: Install
        run: uv sync --frozen

      # cffconvert pins an older jsonschema than geoevals, so it runs in its own uvx environment.
      - name: Validate CITATION.cff
        run: uvx cffconvert==2.0.0 --validate -i CITATION.cff

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff format check
        run: uv run --frozen ruff format --check .

      - name: Pyright
        run: uv run --frozen pyright

      - name: Pytest
        run: uv run --frozen pytest

      # Test fixtures under tests/ are checked by pytest; this covers the shipped benchmarks.
      - name: Validate benchmark specs and dataset manifests
        run: |
          status=0
          files=$(find benchmarks datasets -type f \
            \( -name 'benchmark.yaml' -o -name 'manifest.yaml' \
               -o -path 'datasets/manifests/*.yaml' -o -path 'datasets/manifests/*.jsonl' \) \
            | sort -u)
          if [ -z "$files" ]; then echo "no benchmark specs or manifests found"; exit 1; fi
          for file in $files; do
            uv run --frozen geoevals validate "$file" || status=1
          done
          exit $status

      - name: License inventory is up to date
        run: uv run --frozen geoevals data inventory --check

      # Regenerates docs/dependency-licenses.md for this job's Python and platform; exits 1 on a
      # GPL or AGPL runtime dependency (GeoEvals is MIT licensed).
      - name: Dependency license report
        run: |
          uv run --frozen geoevals data licenses --out docs/dependency-licenses.md
          cat docs/dependency-licenses.md

      - name: Smoke run
        run: |
          uv run --frozen geoevals run --benchmark benchmarks/smoke/benchmark.yaml \
            --adapter mock --config benchmarks/smoke/run_config.yaml --out runs/smoke

      - name: Smoke report
        run: |
          run_dir=$(find runs/smoke -mindepth 1 -maxdepth 1 -type d)
          uv run --frozen geoevals validate "$run_dir/result.json"
          uv run --frozen geoevals report "$run_dir"
          cat "$run_dir/report.md"


      # Also covered by the integration test in tests/test_reproduce.py; this shows the CLI output.
      - name: Reproduce the published baseline
        run: uv run --frozen geoevals reproduce baselines/gis_correctness/gis_baseline

  secrets:
    name: Secrets scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks
          rm "$archive"

      # Scans every commit reachable from the checkout; exits 1 on any finding.
      - name: Scan the git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
