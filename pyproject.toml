[project]
name = "geoevals"
version = "0.1.0"
description = "Reproducible evaluation framework for geospatial AI systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GeoEvals contributors" }]
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "packaging>=24",
    "psutil>=7.2.2",
    "pyarrow>=26.0.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "shapely>=2",
    "tzdata>=2026.5",
]

[project.scripts]
geoevals = "geoevals.cli:main"

[project.optional-dependencies]
network = [
    "networkx>=3.6.1",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoevals"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "geoevals/_schemas"

[dependency-groups]
dev = [
    "networkx>=3.6.1",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.11",
    "scipy>=1.14",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not network"]
markers = [
    "integration: runs a whole benchmark end to end (a few seconds); part of the default run and CI",
    "network: downloads real data (OpenStreetMap via Overpass); excluded by default and from CI, run manually with `pytest -m network`",
]
