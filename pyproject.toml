[project]
name = "geoevals"
version = "0.1.0.dev0"
description = "Reproducible evaluation framework for geospatial AI systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GeoEvals contributors" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
geoevals = "geoevals.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoevals"]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
