<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The spatial relations the graded evals test</title>
  <desc id="d">Six panels: proximity (nearest on foot, not in a straight line), adjacency (a shared wall), line of sight (a building hidden behind another except for a sliver), containment (inside, on the boundary, overlapping), direction (the straight bearing versus the turns of the walk), and a closure that forces a detour around.</desc>
  <rect width="800" height="520" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1f2933"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e12d39"/>
    </marker>
  </defs>

  <!-- panel frames: 3 columns x 2 rows, each 240 x 220 -->
  <g fill="#f5f7fa" stroke="#cbd2d9">
    <rect x="20" y="30" width="240" height="220" rx="8"/>
    <rect x="280" y="30" width="240" height="220" rx="8"/>
    <rect x="540" y="30" width="240" height="220" rx="8"/>
    <rect x="20" y="280" width="240" height="220" rx="8"/>
    <rect x="280" y="280" width="240" height="220" rx="8"/>
    <rect x="540" y="280" width="240" height="220" rx="8"/>
  </g>

  <!-- 1 proximity -->
  <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Proximity</text>
  <line x1="20" y1="110" x2="260" y2="110" stroke="#52606d" stroke-width="3"/>
  <line x1="20" y1="110" x2="260" y2="110" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="235" y="102" text-anchor="end" font-size="11" fill="#52606d">railway</text>
  <circle cx="80" cy="190" r="8" fill="#e12d39"/>
  <text x="80" y="214" text-anchor="middle" font-size="12" fill="#1f2933">start</text>
  <circle cx="110" cy="70" r="8" fill="#9aa5b1"/>
  <text x="110" y="56" text-anchor="middle" font-size="12" fill="#52606d">A: nearer as the crow flies</text>
  <line x1="82" y1="182" x2="108" y2="78" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="215" cy="185" r="8" fill="#2186eb"/>
  <text x="215" y="160" text-anchor="middle" font-size="12" fill="#1f2933">B: nearer on foot</text>
  <path d="M88 190 L 207 186" stroke="#e12d39" stroke-width="3" fill="none"/>
  <text x="140" y="238" text-anchor="middle" font-size="12" fill="#52606d">near, far, nearest</text>

  <!-- 2 adjacency -->
  <text x="400" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Adjacency</text>
  <rect x="320" y="80" width="70" height="90" fill="#d9e2ec" stroke="#52606d" stroke-width="1.5"/>
  <rect x="390" y="80" width="80" height="90" fill="#d9e2ec" stroke="#52606d" stroke-width="1.5"/>
  <line x1="390" y1="80" x2="390" y2="170" stroke="#e12d39" stroke-width="4"/>
  <text x="390" y="70" text-anchor="middle" font-size="12" fill="#e12d39">shared wall</text>
  <rect x="320" y="185" width="50" height="30" fill="#d9e2ec" stroke="#52606d" stroke-width="1.5"/>
  <rect x="380" y="185" width="50" height="30" fill="#d9e2ec" stroke="#52606d" stroke-width="1.5"/>
  <text x="470" y="205" text-anchor="middle" font-size="12" fill="#52606d">a gap</text>
  <text x="400" y="238" text-anchor="middle" font-size="12" fill="#52606d">touching, next to, apart</text>

  <!-- 3 line of sight (plan view) -->
  <text x="660" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Line of sight</text>
  <circle cx="570" cy="150" r="8" fill="#e12d39"/>
  <text x="570" y="176" text-anchor="middle" font-size="12" fill="#1f2933">eye</text>
  <rect x="640" y="122" width="34" height="68" fill="#7b8794"/>
  <text x="657" y="210" text-anchor="middle" font-size="11" fill="#52606d">taller building</text>
  <rect x="715" y="70" width="45" height="110" fill="#d9e2ec" stroke="#52606d" stroke-width="1.5"/>
  <text x="737" y="62" text-anchor="middle" font-size="12" fill="#1f2933">target</text>
  <g stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="570" y1="150" x2="640" y2="132"/>
    <line x1="570" y1="150" x2="640" y2="150"/>
    <line x1="570" y1="150" x2="640" y2="168"/>
  </g>
  <line x1="570" y1="150" x2="715" y2="75" stroke="#1d9a6c" stroke-width="2.5"/>
  <text x="610" y="92" font-size="11" fill="#1d9a6c">one end shows</text>
  <text x="660" y="238" text-anchor="middle" font-size="12" fill="#52606d">behind, past, in view</text>

  <!-- 4 containment -->
  <text x="140" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Containment</text>
  <path d="M50 330 L 170 315 L 200 400 L 120 450 L 45 420 Z" fill="#c1eac5" stroke="#1d9a6c" stroke-width="2"/>
  <text x="85" y="345" font-size="11" fill="#1d6b4a">park</text>
  <path d="M200 290 L 260 290 L 260 500 L 225 500 Z" fill="#9fd3f5"/>
  <circle cx="110" cy="385" r="7" fill="#e12d39"/>
  <text x="110" y="372" text-anchor="middle" font-size="11" fill="#1f2933">inside</text>
  <circle cx="45" cy="420" r="7" fill="#e12d39"/>
  <text x="55" y="445" text-anchor="middle" font-size="11" fill="#1f2933">on the edge</text>
  <line x1="185" y1="370" x2="240" y2="360" stroke="#52606d" stroke-width="5"/>
  <text x="214" y="345" text-anchor="middle" font-size="11" fill="#1f2933">pier: in both</text>
  <text x="140" y="488" text-anchor="middle" font-size="12" fill="#52606d">in, within, overlapping</text>

  <!-- 5 direction -->
  <text x="400" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Direction</text>
  <circle cx="320" cy="440" r="8" fill="#e12d39"/>
  <text x="320" y="466" text-anchor="middle" font-size="12" fill="#1f2933">start</text>
  <circle cx="470" cy="320" r="8" fill="#2186eb"/>
  <text x="470" y="306" text-anchor="middle" font-size="12" fill="#1f2933">goal</text>
  <line x1="326" y1="434" x2="462" y2="326" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="370" y="368" font-size="12" fill="#1f2933" transform="rotate(-38 370 368)">bearing NE</text>
  <path d="M328 440 L 480 440 L 480 380 L 420 380 L 420 320 L 460 320" fill="none" stroke="#e12d39" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowred)"/>
  <text x="485" y="410" font-size="11" fill="#e12d39">turn left</text>
  <text x="400" y="488" text-anchor="middle" font-size="12" fill="#52606d">which way, turn by turn</text>

  <!-- 6 closure -->
  <text x="660" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Through and around</text>
  <rect x="540" y="370" width="240" height="40" fill="#9fd3f5"/>
  <rect x="610" y="362" width="16" height="56" fill="#7b8794"/>
  <text x="618" y="395" text-anchor="middle" font-size="20" font-weight="bold" fill="#e12d39">✕</text>
  <rect x="730" y="362" width="16" height="56" fill="#7b8794"/>
  <circle cx="600" cy="460" r="8" fill="#e12d39"/>
  <circle cx="640" cy="320" r="8" fill="#2186eb"/>
  <path d="M600 452 L 600 440 L 618 440 L 618 340 L 632 322" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M608 460 L 738 450 L 738 330 L 648 320" fill="none" stroke="#e12d39" stroke-width="3" stroke-linejoin="round"/>
  <text x="620" y="352" text-anchor="end" font-size="11" fill="#52606d">closed</text>
  <text x="660" y="488" text-anchor="middle" font-size="12" fill="#52606d">blocked, detour, cut off</text>
</svg>
