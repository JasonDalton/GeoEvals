    version: 1.0.0
    params:
      units: m
tolerances:
  distance:
    value: 0.01
    units: m
dataset_manifest: manifest.yaml
license: MIT
provenance:
  authors: [GeoEvals contributors]
  created: 2026-10-09
limitations:
  - Synthetic points only.
